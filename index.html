<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MK Arcade · Rokaia vs Joe</title>
<link rel="stylesheet" href="Rokaia/styles.css">
</head>
<body>
<main class="arcade">
  <div class="screen">
    <canvas id="stage" width="1280" height="720" aria-label="MK Arcade game"></canvas>
    <div class="touch" id="touch" aria-hidden="true">
      <div class="pad">
        <button data-k="up">&#9650;</button>
        <button data-k="left">&#9664;</button>
        <button data-k="down">&#9660;</button>
        <button data-k="right">&#9654;</button>
      </div>
      <div class="acts">
        <button data-k="punch">PUNCH</button>
        <button data-k="kick">KICK</button>
        <button data-k="block">BLOCK</button>
        <button data-k="special">SPECIAL</button>
      </div>
    </div>
  </div>
</main>
<script src="Rokaia/engine.js"></script>
</body>
</html>
