<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK Web Games</title>
<style>
  :root { --bg: #0d0b12; --panel: #17141f; --line: #2f2840; --text: #ece7f5; --muted: #9a90ad; --red: #d3263a; --red-2: #ff5468; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 0%, #2a1320, var(--bg) 60%); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { width: 100%; max-width: 760px; }
  h1 { margin: 0 0 4px; font: 900 40px/1 Impact, "Arial Black", sans-serif; letter-spacing: .1em; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  a.card { display: block; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.card:hover, a.card:focus-visible { border-color: var(--red-2); transform: translateY(-2px); outline: none; }
  a.card h2 { margin: 0 0 6px; font: 900 22px/1.1 Impact, "Arial Black", sans-serif; letter-spacing: .06em; }
  a.card p { margin: 0; color: var(--muted); font-size: 14px; }
  a.card span { display: inline-block; margin-top: 12px; color: var(--red-2); font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>MK WEB GAMES</h1>
  <p class="lead">Browser fighting-game builds. Pick one to open.</p>
  <div class="grid">
    <a class="card" href="Rokaia/">
      <h2>ROKAIA</h2>
      <p>Sprite animation engine: moves, ponytail whip special, and the victory routine synced to her song.</p>
      <span>Open the engine →</span>
    </a>
    <a class="card" href="WebGame/">
      <h2>MOE VS JOE</h2>
      <p>The original two-player fighting game, with local and online play.</p>
      <span>Play →</span>
    </a>
  </div>
</main>
</body>
</html>
